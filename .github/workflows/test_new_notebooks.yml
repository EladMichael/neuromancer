name: Test New Notebooks

on:
  pull_request:
    branches:
      - develop

env:
  NOTEBOOK_CI_SKIP_NOTEBOOKS: |
    examples/neural_operators/Part_8_TIDON_HEAT.ipynb
    examples/control/Part_7_TIDON_DPC_HEAT.ipynb

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect added notebooks
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          list_file="$RUNNER_TEMP/new_notebooks.zlist"
          : > "$list_file"

          git diff --name-only --diff-filter=A -z \
            "${{ github.event.pull_request.base.sha }}" HEAD -- "*.ipynb" \
            > "$list_file"

          mapfile -d '' -t added_notebooks < "$list_file"

          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"
          echo "count=${#added_notebooks[@]}" >> "$GITHUB_OUTPUT"

          if [ "${#added_notebooks[@]}" -eq 0 ]; then
            echo "No new notebooks were added in this pull request."
            echo "::group::Notebook summary"
            echo "Selected: 0"
            echo "Passed: 0"
            echo "Failed: 0"
            echo "Timed out: 0"
            echo "::endgroup::"
            exit 0
          fi

          echo "Added notebook candidates from git diff:"
          printf '  %s\n' "${added_notebooks[@]}"

      - name: Set up Python
        if: steps.detect.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
          python -m pip install --upgrade pip
          python -m pip install ".[examples]" nbconvert jupyter ipykernel

      - name: Diagnostics
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          echo "::group::Environment"
          pwd
          python --version
          python -m pip --version
          python -m pip list
          echo "::endgroup::"

      - name: Register Jupyter kernel
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list

      - name: Run added notebooks
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          bash ./run_notebooks.sh ci-kernel . 3600 "${{ steps.detect.outputs.list_file }}"
