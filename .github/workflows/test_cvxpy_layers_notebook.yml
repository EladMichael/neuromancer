name: Test CVXPY Layers Notebook

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[examples]" nbconvert jupyter ipykernel
          python -m pip install --no-cache-dir \
            "cvxpylayers==0.1.8" \
            "cvxpy==1.7.5" \
            "diffcp==1.1.4"

      - name: Diagnostics
        run: |
          set -euo pipefail
          echo "::group::Environment"
          pwd
          python --version
          python -m pip --version
          python -m pip list
          python - <<'PY'
          from importlib.metadata import version

          for package in ("cvxpy", "cvxpylayers", "diffcp"):
              print(f"{package}: {version(package)}")
          PY
          echo "::endgroup::"

      - name: Register Jupyter kernel
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list

      - name: Select CVXPY layers notebook
        id: notebooks
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/cvxpy_layers_notebook.zlist"
          printf '%s\0' "examples/parametric_programming/Part_5_cvxpy_layers.ipynb" > "$list_file"
          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"
          echo "Selected notebook:"
          tr '\0' '\n' < "$list_file" | sed 's/^/  /'

      - name: Run CVXPY layers notebook
        run: |
          set -euo pipefail
          bash ./run_notebooks.sh ci-kernel . 3600 "${{ steps.notebooks.outputs.list_file }}"
