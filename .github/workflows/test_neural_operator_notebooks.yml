name: Test Neural Operator Notebooks

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NOTEBOOK_CI_SKIP_REASON: >-
    These explicit CI exceptions require a large external data source or network
    data download that is not available on GitHub-hosted runners.
  NOTEBOOK_CI_SKIP_NOTEBOOKS: |
    examples/neural_operators/Part_2_DeepONet_antiderivative_unaligned.ipynb
    examples/neural_operators/Part_8_TIDON_HEAT.ipynb

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
          python -m pip install --upgrade pip
          python -m pip uninstall -y neuromancer || true
          python -m pip install -e ".[examples]" nbconvert jupyter ipykernel

      - name: Diagnostics
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          echo "::group::Environment"
          pwd
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "PR head=${{ github.event.pull_request.head.sha }}"
            echo "PR base=${{ github.event.pull_request.base.sha }}"
          fi
          echo "checked_out=$(git rev-parse HEAD)"
          test -f src/neuromancer/modules/operators.py
          echo "operators.py exists: src/neuromancer/modules/operators.py"
          python --version
          python -m pip --version
          python -m pip list
          python - <<'PY'
          import importlib.util

          import neuromancer
          from neuromancer.modules.operators import FNO

          print("neuromancer:", neuromancer.__file__)
          spec = importlib.util.find_spec("neuromancer.modules.operators")
          print("neuromancer.modules.operators:", spec.origin if spec else None)
          print("FNO:", FNO)
          PY
          echo "::endgroup::"

      - name: Register Jupyter kernel
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list

      - name: Select neural operator notebooks
        id: notebooks
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/neural_operator_notebooks.zlist"
          find examples/neural_operators -maxdepth 1 -type f -name "*.ipynb" -print0 \
            | LC_ALL=C sort -z > "$list_file"
          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"
          echo "Neural operator notebooks selected from examples/neural_operators:"
          tr '\0' '\n' < "$list_file" | sed 's/^/  /'

      - name: Run neural operator notebooks
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          NOTEBOOK_LOG_DIR: ${{ runner.temp }}/neural-operator-notebook-logs
          NOTEBOOK_LOG_TAIL_LINES: "300"
        run: |
          set -euo pipefail
          mkdir -p "$NOTEBOOK_LOG_DIR"
          bash ./run_notebooks.sh ci-kernel . 3600 "${{ steps.notebooks.outputs.list_file }}"

      - name: Upload neural operator notebook logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-operator-notebook-logs
          path: ${{ runner.temp }}/neural-operator-notebook-logs
          if-no-files-found: ignore
