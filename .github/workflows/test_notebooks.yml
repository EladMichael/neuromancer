name: Run Notebook Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NOTEBOOK_CI_SKIP_NOTEBOOKS: |
    examples/neural_operators/Part_8_TIDON_HEAT.ipynb
    examples/control/Part_7_TIDON_DPC_HEAT.ipynb

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
          python -m pip install --upgrade pip
          python -m pip install ".[examples]" nbconvert jupyter ipykernel

      - name: Diagnostics
        run: |
          set -euo pipefail
          echo "::group::Environment"
          pwd
          python --version
          python -m pip --version
          python -m pip list
          echo "::endgroup::"

      - name: Register Jupyter kernel
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list

      - name: Run notebooks
        run: |
          set -euo pipefail
          bash ./run_notebooks.sh ci-kernel . 3600
