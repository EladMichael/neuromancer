name: Run Notebook Tests

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NOTEBOOK_CI_SKIP_REASON: >-
    These explicit CI exceptions either require a large external data source,
    network data download, or GPU backend; are scratch notebooks scheduled to be
    deleted in a near-future release; require a dedicated dependency stack; or
    are covered by current issue tracking.
  NOTEBOOK_CI_SKIP_NOTEBOOKS: |
    examples/neural_operators/Part_2_DeepONet_antiderivative_unaligned.ipynb
    examples/neural_operators/Part_8_TIDON_HEAT.ipynb
    examples/control/Part_7_TIDON_DPC_HEAT.ipynb
    examples/ODEs/scratch/*.ipynb
    examples/lightning_integration_examples/*.ipynb
    examples/lightning_integration_examples/other_examples/*.ipynb
    examples/parametric_programming/Part_5_cvxpy_layers.ipynb
    examples/psl/systems.ipynb

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
          python -m pip install --upgrade pip
          python -m pip install -e ".[examples]" nbconvert jupyter ipykernel

      - name: Diagnostics
        run: |
          set -euo pipefail
          echo "::group::Environment"
          pwd
          python --version
          python -m pip --version
          python -m pip list
          python - <<'PY'
          import neuromancer

          print("neuromancer:", neuromancer.__file__)
          PY
          echo "::endgroup::"

      - name: Register Jupyter kernel
        run: |
          set -euo pipefail
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list

      - name: Select example notebooks
        id: notebooks
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/example_notebooks.zlist"
          find examples -type f -name "*.ipynb" -print0 \
            | LC_ALL=C sort -z > "$list_file"

          mapfile -d '' -t notebooks < "$list_file"
          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"

          if [ "${#notebooks[@]}" -eq 0 ]; then
            echo "ERROR: no notebooks found under examples/." >&2
            exit 2
          fi

          echo "Example notebooks selected from examples/:"
          printf '  %s\n' "${notebooks[@]}"

      - name: Run notebooks
        run: |
          set -euo pipefail
          bash ./run_notebooks.sh ci-kernel . 3600 "${{ steps.notebooks.outputs.list_file }}"
